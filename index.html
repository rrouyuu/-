    <!-- Firebase Realtime Cloud Firestore Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cinnamoroll-sister-board';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-api-key",
                authDomain: "demo-project.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo-project.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef"
              };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeListener = null;

        window.messages = [];

        async function initAuthAndRealtime() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth token fallback to anonymous", err);
                await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                setupRealtimeListener();
            }
        });

        function setupRealtimeListener() {
            if (unsubscribeListener) unsubscribeListener();

            const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

            unsubscribeListener = onSnapshot(messagesCollection, (snapshot) => {
                const list = [];
                snapshot.forEach((docSnap) => {
                    list.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                window.messages = list;
                window.renderMessages();
                if (window.isAdminLoggedIn) {
                    window.renderAdminMessages();
                }
            }, (error) => {
                console.error("Firestore Listener Error:", error);
                document.getElementById('syncStatusText').innerHTML = `<span class="text-amber-600">本機預覽模式</span>`;
            });
        }

        window.postCloudMessage = async function(newMsg) {
            if (!currentUser) return;
            const docId = `msg_${Date.now()}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', docId);
            await setDoc(docRef, {
                ...newMsg,
                createdAt: Date.now()
            });
        };

        window.updateCloudReply = async function(id, replyText) {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', String(id));
            await updateDoc(docRef, { reply: replyText });
        };

        window.deleteCloudMessage = async function(id) {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', String(id));
            await deleteDoc(docRef);
        };

        initAuthAndRealtime();
    </script>

    <!-- Main Logic Script -->
    <script>
        let selectedMood = { emoji: '😊', label: '快樂', zhuyin: 'ㄎㄨㄞˋ ㄌㄜˋ' };
        let isCustomMood = false;
        window.isAdminLoggedIn = false;

        // Local Storage Init & Theme Setup
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhoto = localStorage.getItem('sister_board_photo');
            if (savedPhoto) {
                document.getElementById('mainSisterPhoto').src = savedPhoto;
            }
            const savedTheme = localStorage.getItem('sister_board_theme');
            if (savedTheme) {
                changeTheme(savedTheme, false);
            }
            // Seed initial mock messages if empty
            if (!window.messages || window.messages.length === 0) {
                window.messages = [
                    {
                        id: 'demo_1',
                        sender: '妹妹 👧🏻',
                        mood: '😊 快樂',
                        content: '姊姊！這是我用手機寫給妳的第一則留言喔～看得到嗎？✨',
                        timestamp: '2026/11/05 18:30',
                        reply: '看到了！姊姊隨時都在線上看妳的留言喔 💖'
                    }
                ];
                renderMessages();
            }
        });

        function selectMood(emoji, label, zhuyin) {
            isCustomMood = false;
            selectedMood = { emoji, label, zhuyin };
            document.getElementById('customMoodContainer').classList.add('hidden');
            const btns = document.querySelectorAll('.mood-btn');
            btns.forEach(btn => {
                if (btn.innerText.includes(label)) {
                    btn.classList.add('border-sky-300', 'bg-cinnaSky');
                    btn.classList.remove('border-transparent', 'bg-warmCream');
                } else {
                    btn.classList.remove('border-sky-300', 'bg-cinnaSky');
                    btn.classList.add('border-transparent', 'bg-warmCream');
                }
            });
        }

        function selectCustomMood() {
            isCustomMood = true;
            document.getElementById('customMoodContainer').classList.remove('hidden');
            const btns = document.querySelectorAll('.mood-btn');
            btns.forEach(btn => {
                if (btn.innerText.includes('自己寫')) {
                    btn.classList.add('border-sky-300', 'bg-cinnaSky');
                    btn.classList.remove('border-transparent', 'bg-warmCream');
                } else {
                    btn.classList.remove('border-sky-300', 'bg-cinnaSky');
                    btn.classList.add('border-transparent', 'bg-warmCream');
                }
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const sender = document.getElementById('senderInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();

            if (!sender || !content) return;

            let moodText = `${selectedMood.emoji} ${selectedMood.label}`;
            if (isCustomMood) {
                const customText = document.getElementById('customMoodInput').value.trim();
                moodText = customText ? `✨ ${customText}` : `✨ 特別的心情`;
            }

            const now = new Date();
            const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            const newMsg = {
                sender: sender,
                mood: moodText,
                content: content,
                timestamp: timeStr,
                reply: ""
            };

            if (window.postCloudMessage) {
                await window.postCloudMessage(newMsg);
            } else {
                newMsg.id = `msg_${Date.now()}`;
                window.messages.unshift(newMsg);
                renderMessages();
            }

            document.getElementById('contentInput').value = '';
            if (isCustomMood) {
                document.getElementById('customMoodInput').value = '';
            }

            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.7 },
                colors: ['#7DD3FC', '#F472B6', '#FEF08A']
            });
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const countSpan = document.getElementById('messageCount');
            const msgs = window.messages || [];

            countSpan.innerText = `共 ${msgs.length} 則留言`;

            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white/80 rounded-3xl p-8 text-center border-2 border-dashed border-sky-200">
                        <p class="text-4xl mb-2">☁️</p>
                        <p class="font-bold text-warmBrown text-base">還沒有留言喔！快來當第一個留言的人吧 💕</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = msgs.map(msg => `
                <div class="bg-white rounded-3xl p-5 md:p-6 border-3 border-sky-100 shadow-card relative transition-all hover:translate-y-[-2px]">
                    <div class="flex items-center justify-between pb-3 border-b border-sky-50 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">☁️</span>
                            <div>
                                <h4 class="font-black text-warmBrown text-base md:text-lg">${escapeHtml(msg.sender)}</h4>
                                <span class="text-xs bg-cinnaSky text-sky-700 px-2.5 py-0.5 rounded-full font-bold border border-sky-200 inline-block">
                                    ${escapeHtml(msg.mood)}
                                </span>
                            </div>
                        </div>
                        <span class="text-xs text-gray-400 font-medium">${escapeHtml(msg.timestamp)}</span>
                    </div>

                    <p class="text-warmBrown font-medium text-base md:text-lg leading-relaxed whitespace-pre-line px-1">
                        ${escapeHtml(msg.content)}
                    </p>

                    ${msg.reply ? `
                        <div class="mt-4 bg-softPink/60 rounded-2xl p-3.5 border-2 border-pink-200 relative">
                            <div class="flex items-center gap-1.5 mb-1 text-pink-700 font-black text-xs md:text-sm">
                                <span>👑</span>
                                <ruby>姊<rt>ㄐㄧㄝˇ</rt></ruby><ruby>姊<rt>ㄐㄧㄝˇ</rt></ruby><ruby>的<rt>ㄉㄜ˙</rt></ruby><ruby>回<rt>ㄏㄨㄟˊ</rt></ruby><ruby>覆<rt>ㄈㄨˋ</rt></ruby>：
                            </div>
                            <p class="text-warmBrown font-bold text-sm md:text-base pl-1">
                                ${escapeHtml(msg.reply)}
                            </p>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Admin Backstage Logic
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function verifyAdmin() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === "888") {
                window.isAdminLoggedIn = true;
                document.getElementById('adminAuthView').classList.add('hidden');
                document.getElementById('adminPanelView').classList.remove('hidden');
                renderAdminMessages();
            } else {
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            window.isAdminLoggedIn = false;
            document.getElementById('adminAuthView').classList.remove('hidden');
            document.getElementById('adminPanelView').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('authError').classList.add('hidden');
        }

        function updateMainPhoto() {
            const url = document.getElementById('photoUrlInput').value.trim();
            if (!url) return;
            document.getElementById('mainSisterPhoto').src = url;
            localStorage.setItem('sister_board_photo', url);
            alert("主頁面照片已順利更新！✨");
        }

        function changeTheme(themeKey, save = true) {
            const themes = {
                sky: { bg: '#FDF7EE', border: '#7DD3FC' },
                pink: { bg: '#FFF5F7', border: '#F472B6' },
                milk: { bg: '#F7F3EE', border: '#F59E0B' },
                mint: { bg: '#F0FDF4', border: '#34D399' },
                purple: { bg: '#FAF5FF', border: '#C084FC' }
            };
            const theme = themes[themeKey] || themes.sky;
            document.body.style.backgroundColor = theme.bg;
            document.querySelectorAll('.cloud-container').forEach(el => {
                el.style.borderColor = theme.border;
            });
            if (save) {
                localStorage.setItem('sister_board_theme', themeKey);
            }
        }

        function renderAdminMessages() {
            if (!window.isAdminLoggedIn) return;
            const container = document.getElementById('adminMessagesList');
            const msgs = window.messages || [];

            if (msgs.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-4">目前沒有留言。</p>`;
                return;
            }

            container.innerHTML = msgs.map(msg => `
                <div class="bg-warmCream p-3 rounded-2xl border border-pink-200 text-xs flex flex-col gap-2">
                    <div class="flex justify-between font-bold text-warmBrown">
                        <span>${escapeHtml(msg.sender)} (${escapeHtml(msg.mood)})</span>
                        <button onclick="handleDeleteMessage('${msg.id}')" class="text-red-400 hover:text-red-600 font-bold cursor-pointer">刪除 🗑️</button>
                    </div>
                    <p class="text-gray-600">${escapeHtml(msg.content)}</p>
                    
                    <div class="flex gap-1.5 mt-1">
                        <input type="text" id="replyInput-${msg.id}" value="${escapeHtml(msg.reply || '')}" placeholder="寫下對妹妹的回覆..." 
                               class="flex-1 px-3 py-1.5 rounded-xl border border-pink-200 focus:outline-none text-xs font-medium">
                        <button onclick="handleSaveReply('${msg.id}')" class="bg-cinnaBlue text-white px-3 py-1.5 rounded-xl font-bold hover:bg-sky-500 shadow-sm cursor-pointer">
                            同步回覆
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function handleSaveReply(id) {
            const input = document.getElementById(`replyInput-${id}`);
            if (!input) return;
            const replyText = input.value.trim();
            if (window.updateCloudReply) {
                await window.updateCloudReply(id, replyText);
            } else {
                const target = window.messages.find(m => m.id === id);
                if (target) target.reply = replyText;
                renderMessages();
            }
            alert("已同步發布回覆！✨");
        }

        async function handleDeleteMessage(id) {
            if (window.deleteCloudMessage) {
                await window.deleteCloudMessage(id);
            } else {
                window.messages = window.messages.filter(m => m.id !== id);
                renderMessages();
                renderAdminMessages();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;")
                              .replace(/</g, "&lt;")
                              .replace(/>/g, "&gt;")
                              .replace(/"/g, "&quot;")
                              .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
